name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet package cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          # No packages.lock.json exists yet. Package definitions and build inputs determine cache validity.
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify
        shell: pwsh
        run: ./eng/verify.ps1

      - name: Upload test results
        if: ${{ always() && hashFiles('**/*.trx') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
